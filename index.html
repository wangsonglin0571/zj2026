<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="浙江争冠">
<meta name="theme-color" content="#0C1F0E">
<title>浙江队 · 2026争冠</title>
<style>
/* 不使用Google Fonts，使用系统字体 */
:root {
  --dark:    #0C1F0E;
  --green1:  #132B15;
  --green2:  #1A3A1D;
  --green3:  #22502A;
  --gold:    #C8A84B;
  --gold-l:  #E2C46A;
  --white:   #FFFFFF;
  --text:    #EAF2EA;
  --muted:   rgba(234,242,234,0.45);
  --dim:     rgba(234,242,234,0.2);
  --border:  rgba(200,168,75,0.15);
  --border2: rgba(200,168,75,0.28);
  --green-hi:#34C759;
  --red:     #E74C3C;
  --yellow:  #F1C40F;
  --safe-top: env(safe-area-inset-top,44px);
  --safe-bot: env(safe-area-inset-bottom,34px);
  --font-display: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
  --font-body: -apple-system, "SF Pro Text", "PingFang SC", "Noto Sans CJK SC", sans-serif;
  --font-num: "SF Pro Display", -apple-system, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  background: #0C1F0E;
  color: #EAF2EA;
  font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
}
#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
.safe-top { height: 0; background: #132B15; flex-shrink: 0; }

/* NAV */
.nav {
  flex-shrink: 0;
  background: #132B15;
  border-bottom: 2px solid #C8A84B;
  padding: max(env(safe-area-inset-top), 11px) 18px 12px;
  display: flex; justify-content: space-between; align-items: center;
}
.nav-left { display: flex; align-items: center; gap: 10px; }
.nav-crest {
  width: 34px; height: 34px;
  border-radius: 50% 50% 44% 44%;
  background: #C8A84B;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.nav-crest span { font-size: 14px; font-weight: 800; color: #0C1F0E; }
.nav-title { font-size: 18px; font-weight: 700; color: #FFFFFF; letter-spacing: 2px; }
.nav-sub { font-size: 10px; color: #C8A84B; margin-top: 1px; letter-spacing: 1px; }
.nav-badge {
  background: #C8A84B; color: #0C1F0E;
  font-size: 13px; font-weight: 700;
  padding: 4px 12px; border-radius: 4px; letter-spacing: 1px;
}

/* SCROLL */
.scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: calc(var(--safe-bot) + 20px); }

/* HERO */
.hero {
  margin: 14px 16px 0;
  background: linear-gradient(145deg, #1A3A1D 0%, #132B15 100%);
  border: 1px solid rgba(200,168,75,0.28);
  border-radius: 12px; padding: 20px;
  position: relative; overflow: hidden;
}
.hero::after {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, #C8A84B, transparent);
}
.hero-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
.hero-lbl { font-size: 10px; color: #C8A84B; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 6px; }
.hero-pts { font-size: 76px; font-weight: 700; line-height: 1; letter-spacing: -3px; color: #FFFFFF; }
.hero-unit { font-size: 16px; font-weight: 400; color: #C8A84B; letter-spacing: 0; vertical-align: super; margin-left: 2px; }
.hero-right { text-align: right; padding-top: 6px; }
.hero-rnum { font-size: 36px; font-weight: 700; color: #E2C46A; line-height: 1; }
.hero-rlbl { font-size: 10px; color: rgba(234,242,234,0.45); margin-top: 3px; }
.hero-divider { border-top: 1px solid rgba(200,168,75,0.2); margin-bottom: 14px; }
.hero-stats { display: flex; }
.hstat { flex: 1; text-align: center; }
.hstat + .hstat { border-left: 1px solid rgba(200,168,75,0.15); }
.hstat-val { font-size: 22px; font-weight: 700; color: #FFFFFF; }
.hstat-lbl { font-size: 10px; color: rgba(234,242,234,0.45); margin-top: 2px; }

/* VERDICT */
.verdict {
  margin: 10px 16px 0; border-radius: 8px; padding: 12px 16px;
  display: flex; justify-content: space-between; align-items: center;
  border-left: 3px solid;
}
.verdict.great { background: rgba(200,168,75,0.1); border-color: #C8A84B; }
.verdict.good  { background: rgba(52,199,89,0.08); border-color: #34C759; }
.verdict.ok    { background: rgba(200,168,75,0.07); border-color: #C8A84B; }
.verdict.warn  { background: rgba(241,196,15,0.07); border-color: #F1C40F; }
.verdict.bad   { background: rgba(231,76,60,0.08); border-color: #E74C3C; }
.verdict-label { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
.verdict-label.great,.verdict-label.ok { color: #E2C46A; }
.verdict-label.good  { color: #34C759; }
.verdict-label.warn  { color: #F1C40F; }
.verdict-label.bad   { color: #E74C3C; }
.verdict-sub { font-size: 11px; color: rgba(234,242,234,0.45); margin-top: 2px; }
.verdict-pts { font-size: 22px; font-weight: 700; color: #E2C46A; }

/* NEXT MATCH */
.next-match {
  margin: 10px 16px 0;
  background: linear-gradient(145deg, rgba(26,58,29,0.98) 0%, rgba(19,43,21,0.98) 100%);
  border: 1px solid rgba(200,168,75,0.18);
  border-radius: 10px;
  padding: 14px 16px;
}
.next-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 10px;
}
.next-kicker {
  font-size: 10px;
  font-weight: 700;
  color: #C8A84B;
  letter-spacing: 1.6px;
  text-transform: uppercase;
}
.next-note {
  font-size: 11px;
  color: rgba(234,242,234,0.5);
}
.next-opponent {
  font-size: 28px;
  font-weight: 700;
  color: #FFFFFF;
  line-height: 1.1;
  letter-spacing: 0.4px;
}
.next-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px 14px;
  margin-top: 14px;
}
.next-item {
  padding-top: 10px;
  border-top: 1px solid rgba(200,168,75,0.12);
}
.next-item.full {
  grid-column: 1 / -1;
}
.next-item-lbl {
  font-size: 10px;
  color: rgba(234,242,234,0.42);
  letter-spacing: 1px;
  text-transform: uppercase;
}
.next-item-val {
  margin-top: 4px;
  font-size: 14px;
  font-weight: 600;
  color: #EAF2EA;
  line-height: 1.45;
}

/* SEC + CARD */
.sec { font-size: 10px; font-weight: 700; color: #C8A84B; text-transform: uppercase; letter-spacing: 2px; padding: 16px 16px 8px; }
.card { margin: 0 16px; background: #132B15; border: 1px solid rgba(200,168,75,0.15); border-radius: 10px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-bottom: 1px solid rgba(200,168,75,0.08); }
.row:last-child { border-bottom: none; }

/* STANDINGS */
.rank { font-size: 14px; font-weight: 700; color: rgba(234,242,234,0.45); min-width: 18px; text-align: center; }
.rank.top { color: #C8A84B; }
.team-col { flex: 1; }
.team-nm { font-size: 13px; font-weight: 500; }
.team-nm.me { color: #E2C46A; font-weight: 700; }
.pen-tag { font-size: 10px; padding: 1px 5px; border-radius: 3px; margin-left: 5px; }
.pen-tag.neg  { background: rgba(231,76,60,0.15); color: #E74C3C; }
.pen-tag.zero { background: rgba(52,199,89,0.12); color: #34C759; }
.minibar { height: 2px; background: rgba(255,255,255,0.07); border-radius: 2px; margin-top: 5px; overflow: hidden; }
.minibar-fill { height: 100%; border-radius: 2px; }
.pts { font-size: 18px; font-weight: 700; color: #EAF2EA; }
.pts.me { color: #E2C46A; }

/* GAP */
.gap-name { font-size: 13px; font-weight: 500; flex: 1; }
.gap-right { display: flex; align-items: center; gap: 8px; }
.gap-opp { font-size: 11px; color: rgba(234,242,234,0.45); }
.gap-tag { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 4px; }
.gap-tag.lead   { background: rgba(52,199,89,0.12); color: #34C759; }
.gap-tag.behind { background: rgba(231,76,60,0.12); color: #E74C3C; }
.gap-tag.tie    { background: rgba(241,196,15,0.1);  color: #F1C40F; }

</style>
</head>
<body>
<div id="app">
  <div class="safe-top"></div>
  <div class="nav">
    <div class="nav-left">
      <div class="nav-crest"><span>浙</span></div>
      <div>
        <div class="nav-title">ZHEJIANG FC</div>
        <div class="nav-sub">2026 CSL · 争冠追踪</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="nav-badge" id="round-badge">R6</div>
      <button id="refresh-btn" onclick="manualRefresh()" title="重载最新已发布数据" aria-label="重载最新已发布数据" style="
        background:none;border:1px solid rgba(200,168,75,0.4);border-radius:6px;
        color:#C8A84B;font-size:16px;width:32px;height:32px;cursor:pointer;
        display:flex;align-items:center;justify-content:center;
        transition:all .2s;">↻</button>
    </div>
  </div>
  <div class="scroll">
    <div class="hero">
      <div class="hero-top">
        <div>
          <div class="hero-lbl">实际积分</div>
          <div class="hero-pts" id="h-pts">2<span class="hero-unit">PTS</span></div>
        </div>
        <div class="hero-right">
          <div class="hero-rnum" id="h-remain">27</div>
          <div class="hero-rlbl">轮待战</div>
        </div>
      </div>
      <div class="hero-divider"></div>
      <div class="hero-stats">
        <div class="hstat"><div class="hstat-val" id="h-w">2</div><div class="hstat-lbl">胜</div></div>
        <div class="hstat"><div class="hstat-val" id="h-d">1</div><div class="hstat-lbl">平</div></div>
        <div class="hstat"><div class="hstat-val" id="h-l">1</div><div class="hstat-lbl">负</div></div>
        <div class="hstat"><div class="hstat-val" id="h-gd">+5</div><div class="hstat-lbl">净胜球</div></div>
      </div>
    </div>
    <div class="verdict ok" id="verdict">
      <div>
        <div class="verdict-label ok" id="v-label">争冠竞争者</div>
        <div class="verdict-sub">自动更新 · 当前积分走势</div>
      </div>
      <div class="verdict-pts" id="v-pts">— PTS</div>
    </div>
    <div class="next-match">
      <div class="next-head">
        <div class="next-kicker">下一次比赛</div>
        <div class="next-note" id="next-note">中超第10轮</div>
      </div>
      <div class="next-opponent" id="next-opponent">云南玉昆</div>
      <div class="next-grid">
        <div class="next-item">
          <div class="next-item-lbl">北京时间</div>
          <div class="next-item-val" id="next-kickoff">2026-05-06 20:00</div>
        </div>
        <div class="next-item">
          <div class="next-item-lbl">比赛地点</div>
          <div class="next-item-val" id="next-location">云南玉溪</div>
        </div>
        <div class="next-item full">
          <div class="next-item-lbl">球场</div>
          <div class="next-item-val" id="next-venue">玉溪高原体育运动中心体育场</div>
        </div>
      </div>
    </div>
    <div class="sec">积分对比</div>
    <div class="card" id="standings"></div>
    <div class="sec">与主要对手差距</div>
    <div id="data-updated" style="font-size:10px;color:rgba(234,242,234,0.3);text-align:right;padding:0 16px 6px;"></div>
    <div class="card" id="gaps" style="margin-bottom:20px"></div>
  </div>
</div>
<script>
const TOTAL=30,PEN=-5;
// 对手积分从 data.json 动态加载，以下为初始 fallback
let RIVALS=[
  {name:'成都蓉城',penalty:0,  basePts:16, color:'#3b82f6'},
  {name:'北京国安',penalty:-5, basePts:5,  color:'#a855f7'},
  {name:'上海海港',penalty:-5, basePts:7,  color:'#06b6d4'},
  {name:'山东泰山',penalty:-6, basePts:10, color:'#eab308'},
  {name:'上海申花',penalty:-10,basePts:14, color:'#6b7280'},
];
let NEXT_MATCH={
  opponent:'成都蓉城',
  kickoffBjt:'2026-04-25 19:00',
  venue:'双流体育中心',
  location:'四川成都',
  note:'中超第8轮',
};
let ZHEJIANG=null;
const DATA_SOURCES={
  site:'data.json',
  repo:'https://raw.githubusercontent.com/wangsonglin0571/zj2026/main/data.json',
};
async function fetchData(preferRepo=false){
  const order=preferRepo
    ? [['repo',DATA_SOURCES.repo],['site',DATA_SOURCES.site]]
    : [['site',DATA_SOURCES.site],['repo',DATA_SOURCES.repo]];
  let lastErr=null;
  for(const [name,url] of order){
    try{
      const r=await fetch(url+'?t='+Date.now(),{cache:'no-store'});
      if(!r.ok)continue;
      const d=await r.json();
      return {d,source:name};
    }catch(e){
      lastErr=e;
    }
  }
  throw lastErr||new Error('fetch failed');
}
function applyData(d,source){
  if(d.rivals&&d.rivals.length){RIVALS=d.rivals;}
  if(d.nextMatch){NEXT_MATCH={...NEXT_MATCH,...d.nextMatch};}
  if(d.zhejiang){ZHEJIANG=d.zhejiang;}
  const el=document.getElementById('data-updated');
  if(el&&d.updated){
    const src=source==='repo'?'GitHub最新提交':'当前发布页';
    el.textContent='对手积分更新：'+d.updated+' · '+src;
  }
  render();
}
async function loadData(opts={}){
  try{
    const {d,source}=await fetchData(Boolean(opts.preferRepo));
    applyData(d,source);
  }catch(e){render();}
}
async function manualRefresh(){
  const btn=document.getElementById('refresh-btn');
  btn.style.transform='rotate(360deg)';
  btn.style.transition='transform 0.6s ease';
  btn.disabled=true;
  await loadData({preferRepo:true});
  setTimeout(()=>{
    btn.style.transform='';
    btn.style.transition='';
    btn.disabled=false;
  },800);
}
const DEF=[
  {round:1,opp:'青岛西海岸',gf:2,ga:0,result:'win', pts:3},
  {round:2,opp:'上海申花',  gf:1,ga:1,result:'draw',pts:1},
  {round:3,opp:'青岛海牛',  gf:4,ga:1,result:'win', pts:3},
  {round:4,opp:'重庆铜梁龙',gf:0,ga:1,result:'loss',pts:0},
  {round:5,opp:'大连英博',  gf:0,ga:2,result:'loss',pts:0},
  {round:6,opp:'北京国安',  gf:1,ga:1,result:'draw',pts:1},
];
const matches=[...DEF];
function calc(){
  if(ZHEJIANG&&Number.isFinite(ZHEJIANG.played)){
    const played=ZHEJIANG.played;
    const gp=ZHEJIANG.gamePts;
    const actual=ZHEJIANG.actual;
    const remain=Math.max(0,TOTAL-played);
    const wins=ZHEJIANG.wins;
    const draws=ZHEJIANG.draws;
    const losses=ZHEJIANG.losses;
    const gf=ZHEJIANG.gf;
    const ga=ZHEJIANG.ga;
    const rate=played>0?gp/played:0;
    const proj=Math.round(actual+rate*remain);
    return{played,gp,actual,remain,wins,draws,losses,gf,ga,proj};
  }
  const played=matches.length,gp=matches.reduce((s,m)=>s+m.pts,0),actual=gp+PEN,remain=TOTAL-played;
  const wins=matches.filter(m=>m.result==='win').length,draws=matches.filter(m=>m.result==='draw').length,losses=matches.filter(m=>m.result==='loss').length;
  const gf=matches.reduce((s,m)=>s+m.gf,0),ga=matches.reduce((s,m)=>s+m.ga,0);
  const rate=played>0?gp/played:0,proj=Math.round(actual+rate*remain);
  return{played,gp,actual,remain,wins,draws,losses,gf,ga,proj};
}
function verdict(pts){
  if(pts>=72)return{cls:'great',label:'夺冠热门'};
  if(pts>=65)return{cls:'good', label:'强力争冠'};
  if(pts>=58)return{cls:'ok',   label:'争冠竞争者'};
  if(pts>=50)return{cls:'warn', label:'争亚冠席位'};
  return           {cls:'bad',  label:'需提升战绩'};
}
function render(){
  const s=calc();
  document.getElementById('round-badge').textContent='R'+s.played;
  document.getElementById('h-pts').innerHTML=s.actual+'<span class="hero-unit">PTS</span>';
  document.getElementById('h-remain').textContent=s.remain;
  document.getElementById('h-w').textContent=s.wins;
  document.getElementById('h-d').textContent=s.draws;
  document.getElementById('h-l').textContent=s.losses;
  const gd=s.gf-s.ga;
  document.getElementById('h-gd').textContent=(gd>=0?'+':'')+gd;
  const fin=s.actual+s.remain*3; // 理论上限（剩余全胜）
  const v=verdict(s.actual);
  document.getElementById('verdict').className='verdict '+v.cls;
  const lbl=document.getElementById('v-label');
  lbl.className='verdict-label '+v.cls; lbl.textContent=v.label;
  document.getElementById('v-pts').textContent=(fin>=0?'+':'')+fin+' PTS 上限';
  document.getElementById('next-opponent').textContent=NEXT_MATCH.opponent||'待定';
  document.getElementById('next-kickoff').textContent=NEXT_MATCH.kickoffBjt||'待更新';
  document.getElementById('next-location').textContent=NEXT_MATCH.location||'待更新';
  document.getElementById('next-venue').textContent=NEXT_MATCH.venue||'待更新';
  document.getElementById('next-note').textContent=NEXT_MATCH.note||'下一轮';
  renderBars(s);renderGaps(s);
}
function renderBars(s){
  const all=[{name:'浙江队',penalty:PEN,gamePts:s.gp,color:'#C8A84B',isMe:true},...RIVALS.map(r=>({...r,gamePts:r.basePts,isMe:false}))]
    .map(t=>({...t,actual:t.gamePts+t.penalty})).sort((a,b)=>b.actual-a.actual);
  const mx=Math.max(...all.map(t=>t.actual),1);
  document.getElementById('standings').innerHTML=all.map((t,i)=>{
    const pct=Math.max(2,(Math.max(0,t.actual)/mx)*100).toFixed(1);
    const pc=t.penalty===0?'zero':'neg',pl=t.penalty===0?'0':'−'+Math.abs(t.penalty);
    return`<div class="row"><div class="rank${i<3?' top':''}"> ${i+1}</div><div class="team-col"><div class="team-nm${t.isMe?' me':''}">
      ${t.isMe?'▶ ':''}${t.name}<span class="pen-tag ${pc}">${pl}</span></div>
      <div class="minibar"><div class="minibar-fill" style="width:${pct}%;background:${t.color}"></div></div></div>
      <div class="pts${t.isMe?' me':''}">${t.actual>=0?'+':''}${t.actual}</div></div>`;
  }).join('');
}
function renderGaps(s){
  document.getElementById('gaps').innerHTML=RIVALS.map(r=>{
    const ra=r.basePts+r.penalty,diff=s.actual-ra;
    const pc=diff>0?'lead':diff<0?'behind':'tie';
    const pt=diff>0?'+'+diff+'分':diff<0?diff+'分':'同分';
    return`<div class="row"><div class="gap-name">${r.name}</div><div class="gap-right"><span class="gap-opp">${ra>=0?'+':''}${ra} PTS</span><span class="gap-tag ${pc}">${pt}</span></div></div>`;
  }).join('');
}
loadData();
</script>
</body>
</html>
