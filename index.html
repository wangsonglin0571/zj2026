<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="浙江争冠">
<meta name="theme-color" content="#0a0a0f">
<title>浙江队 · 争冠追踪</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

:root {
–zj: #1B6FC8;        /* 浙江蓝 */
–zj-light: #4A9BE8;
–zj-glow: rgba(27,111,200,0.3);
–gold: #F5C842;
–green: #2ECC71;
–red: #E74C3C;
–yellow: #F39C12;
–bg: #0a0a0f;
–surface: #13131c;
–surface2: #1c1c2a;
–border: rgba(255,255,255,0.08);
–text: #f0f0f8;
–muted: rgba(240,240,248,0.4);
–safe-top: env(safe-area-inset-top, 44px);
–safe-bot: env(safe-area-inset-bottom, 34px);
}

- { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
height: 100%;
background: var(–bg);
color: var(–text);
font-family: ‘Noto Sans SC’, sans-serif;
overscroll-behavior: none;
-webkit-font-smoothing: antialiased;
}

/* ── SHELL ── */
#app {
display: flex;
flex-direction: column;
height: 100vh;
height: 100dvh;
}

/* ── STATUS BAR SPACER ── */
.status-bar {
height: var(–safe-top);
background: var(–bg);
flex-shrink: 0;
}

/* ── HEADER ── */
.header {
flex-shrink: 0;
padding: 12px 20px 14px;
background: linear-gradient(180deg, var(–surface) 0%, transparent 100%);
position: relative;
overflow: hidden;
}
.header::after {
content: ‘’;
position: absolute;
bottom: 0; left: 0; right: 0;
height: 1px;
background: linear-gradient(90deg, transparent, var(–zj), transparent);
opacity: 0.6;
}
.header-top {
display: flex;
justify-content: space-between;
align-items: flex-start;
}
.header-title {
font-family: ‘Oswald’, sans-serif;
font-size: 22px;
font-weight: 700;
letter-spacing: 1px;
color: var(–zj-light);
line-height: 1;
}
.header-sub {
font-size: 11px;
color: var(–muted);
margin-top: 3px;
letter-spacing: 0.3px;
}
.round-chip {
background: var(–zj);
color: white;
font-family: ‘Oswald’, sans-serif;
font-size: 13px;
font-weight: 600;
padding: 4px 10px;
border-radius: 20px;
letter-spacing: 0.5px;
}

/* ── TAB BAR ── */
.tabs {
flex-shrink: 0;
display: flex;
padding: 8px 16px 0;
gap: 4px;
background: var(–bg);
}
.tab {
flex: 1;
padding: 8px 4px;
font-size: 12px;
font-family: ‘Noto Sans SC’, sans-serif;
color: var(–muted);
background: none;
border: none;
border-bottom: 2px solid transparent;
cursor: pointer;
text-align: center;
transition: all 0.2s;
letter-spacing: 0.3px;
}
.tab.active {
color: var(–zj-light);
border-bottom-color: var(–zj);
font-weight: 500;
}

/* ── SCROLL AREA ── */
.scroll-area {
flex: 1;
overflow-y: auto;
-webkit-overflow-scrolling: touch;
padding: 14px 16px;
padding-bottom: calc(var(–safe-bot) + 16px);
}
.page { display: none; }
.page.active { display: block; }

/* ── CARDS ── */
.card {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 14px;
padding: 14px 16px;
margin-bottom: 12px;
}
.card-title {
font-family: ‘Oswald’, sans-serif;
font-size: 14px;
font-weight: 600;
letter-spacing: 1.5px;
color: var(–muted);
text-transform: uppercase;
margin-bottom: 12px;
}

/* ── STAT GRID ── */
.stat-grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 10px;
margin-bottom: 12px;
}
.stat-box {
background: var(–surface2);
border-radius: 12px;
padding: 12px;
text-align: center;
border: 1px solid var(–border);
}
.stat-val {
font-family: ‘Oswald’, sans-serif;
font-size: 36px;
font-weight: 700;
line-height: 1;
color: var(–zj-light);
}
.stat-val.gold   { color: var(–gold); }
.stat-val.green  { color: var(–green); }
.stat-val.red    { color: var(–red); }
.stat-val.muted  { color: var(–muted); }
.stat-lbl {
font-size: 11px;
color: var(–muted);
margin-top: 4px;
letter-spacing: 0.3px;
}

/* ── VERDICT BANNER ── */
.verdict-banner {
border-radius: 12px;
padding: 14px 16px;
margin-bottom: 12px;
border: 1px solid;
position: relative;
overflow: hidden;
}
.verdict-banner::before {
content: ‘’;
position: absolute;
inset: 0;
opacity: 0.08;
background: currentColor;
}
.verdict-banner.great  { border-color: var(–gold);   color: var(–gold); }
.verdict-banner.good   { border-color: var(–green);  color: var(–green); }
.verdict-banner.ok     { border-color: var(–zj-light); color: var(–zj-light); }
.verdict-banner.warn   { border-color: var(–yellow); color: var(–yellow); }
.verdict-banner.bad    { border-color: var(–red);    color: var(–red); }
.verdict-icon { font-size: 24px; }
.verdict-text {
font-family: ‘Oswald’, sans-serif;
font-size: 18px;
font-weight: 600;
letter-spacing: 0.5px;
margin-top: 4px;
}
.verdict-sub { font-size: 12px; color: var(–muted); margin-top: 3px; }

/* ── PROGRESS BARS ── */
.team-bar { margin-bottom: 14px; }
.team-bar:last-child { margin-bottom: 0; }
.team-bar-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 5px;
}
.team-bar-name {
font-size: 13px;
font-weight: 500;
display: flex;
align-items: center;
gap: 6px;
}
.penalty-tag {
font-size: 10px;
padding: 1px 5px;
border-radius: 4px;
font-weight: 400;
}
.penalty-tag.neg  { background: rgba(231,76,60,0.2);  color: var(–red); }
.penalty-tag.zero { background: rgba(46,204,113,0.2); color: var(–green); }
.team-bar-pts {
font-family: ‘Oswald’, sans-serif;
font-size: 16px;
font-weight: 600;
}
.bar-track {
height: 6px;
background: rgba(255,255,255,0.06);
border-radius: 3px;
overflow: hidden;
}
.bar-fill {
height: 100%;
border-radius: 3px;
transition: width 0.5s cubic-bezier(.4,0,.2,1);
}

/* ── RECORD FORM ── */
.form-label {
font-size: 11px;
color: var(–muted);
letter-spacing: 0.5px;
text-transform: uppercase;
margin-bottom: 6px;
display: block;
}
.result-row {
display: flex;
gap: 8px;
margin-bottom: 14px;
}
.result-btn {
flex: 1;
padding: 14px 6px;
border: 1.5px solid var(–border);
background: var(–surface2);
color: var(–muted);
border-radius: 10px;
font-size: 13px;
font-family: ‘Noto Sans SC’, sans-serif;
font-weight: 500;
cursor: pointer;
transition: all 0.15s;
text-align: center;
}
.result-btn.sel-win  { border-color: var(–green);  background: rgba(46,204,113,0.12); color: var(–green); }
.result-btn.sel-draw { border-color: var(–yellow); background: rgba(243,156,18,0.12); color: var(–yellow); }
.result-btn.sel-loss { border-color: var(–red);    background: rgba(231,76,60,0.12);  color: var(–red); }

.score-row {
display: flex;
align-items: center;
gap: 10px;
margin-bottom: 14px;
}
.score-input {
flex: 1;
background: var(–surface2);
border: 1.5px solid var(–border);
color: var(–text);
font-family: ‘Oswald’, sans-serif;
font-size: 28px;
font-weight: 600;
text-align: center;
padding: 10px;
border-radius: 10px;
-webkit-appearance: none;
outline: none;
}
.score-input:focus { border-color: var(–zj); }
.score-vs {
font-family: ‘Oswald’, sans-serif;
font-size: 16px;
color: var(–muted);
}

.opp-input {
width: 100%;
background: var(–surface2);
border: 1.5px solid var(–border);
color: var(–text);
font-family: ‘Noto Sans SC’, sans-serif;
font-size: 15px;
padding: 12px 14px;
border-radius: 10px;
margin-bottom: 14px;
outline: none;
-webkit-appearance: none;
}
.opp-input:focus { border-color: var(–zj); }

.quick-opps {
display: flex;
flex-wrap: wrap;
gap: 6px;
margin-bottom: 14px;
}
.quick-opp {
padding: 5px 10px;
border: 1px solid var(–border);
background: var(–surface2);
color: var(–muted);
border-radius: 20px;
font-size: 11px;
font-family: ‘Noto Sans SC’, sans-serif;
cursor: pointer;
}
.quick-opp:active { background: var(–zj); color: white; border-color: var(–zj); }

.submit-btn {
width: 100%;
padding: 15px;
background: var(–zj);
color: white;
border: none;
border-radius: 12px;
font-size: 15px;
font-family: ‘Noto Sans SC’, sans-serif;
font-weight: 700;
letter-spacing: 1px;
cursor: pointer;
transition: all 0.15s;
-webkit-appearance: none;
}
.submit-btn:active { transform: scale(0.98); background: #155aa0; }
.submit-btn:disabled { background: var(–surface2); color: var(–muted); }

/* ── MATCH LIST ── */
.match-item {
display: flex;
align-items: center;
gap: 10px;
padding: 10px 0;
border-bottom: 1px solid var(–border);
}
.match-item:last-child { border-bottom: none; }
.match-dot {
width: 10px; height: 10px;
border-radius: 50%;
flex-shrink: 0;
}
.dot-win  { background: var(–green); }
.dot-draw { background: var(–yellow); }
.dot-loss { background: var(–red); }
.match-round {
font-family: ‘Oswald’, sans-serif;
font-size: 13px;
color: var(–muted);
min-width: 28px;
}
.match-body { flex: 1; }
.match-opp { font-size: 13px; font-weight: 500; }
.match-score { font-size: 11px; color: var(–muted); margin-top: 1px; }
.match-pts {
font-family: ‘Oswald’, sans-serif;
font-size: 15px;
font-weight: 600;
}
.pts-win  { color: var(–green); }
.pts-draw { color: var(–yellow); }
.pts-loss { color: var(–muted); }
.del-btn {
background: none;
border: none;
color: var(–muted);
font-size: 18px;
padding: 4px 8px;
cursor: pointer;
line-height: 1;
}
.del-btn:active { color: var(–red); }
.empty-state {
text-align: center;
padding: 40px 20px;
color: var(–muted);
font-size: 13px;
}
.empty-state .icon { font-size: 36px; margin-bottom: 8px; }

/* ── SIM ── */
.sim-inputs {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 8px;
margin-bottom: 14px;
}
.sim-inp-group { text-align: center; }
.sim-inp-group label {
font-size: 11px;
color: var(–muted);
display: block;
margin-bottom: 4px;
}
.sim-number {
display: flex;
align-items: center;
background: var(–surface2);
border: 1.5px solid var(–border);
border-radius: 10px;
overflow: hidden;
}
.sim-number button {
background: none;
border: none;
color: var(–muted);
font-size: 20px;
padding: 8px 10px;
cursor: pointer;
flex-shrink: 0;
line-height: 1;
}
.sim-number button:active { color: var(–text); }
.sim-number span {
flex: 1;
font-family: ‘Oswald’, sans-serif;
font-size: 22px;
font-weight: 600;
text-align: center;
color: var(–text);
}

.sim-result-card {
background: var(–surface2);
border-radius: 12px;
padding: 14px;
margin-top: 12px;
}
.sim-result-row {
display: flex;
justify-content: space-between;
align-items: center;
padding: 5px 0;
font-size: 13px;
border-bottom: 1px solid var(–border);
}
.sim-result-row:last-child { border-bottom: none; }
.sim-result-row .lbl { color: var(–muted); }
.sim-result-row .val { font-weight: 500; }
.sim-result-row .val.big {
font-family: ‘Oswald’, sans-serif;
font-size: 20px;
font-weight: 700;
color: var(–zj-light);
}
.sim-result-row .val.gold { color: var(–gold); }
.sim-result-row .val.green { color: var(–green); }
.sim-result-row .val.red { color: var(–red); }

.gap-pill {
padding: 4px 10px;
border-radius: 20px;
font-size: 12px;
font-weight: 600;
}
.gap-pill.lead { background: rgba(46,204,113,0.2); color: var(–green); }
.gap-pill.behind { background: rgba(231,76,60,0.2); color: var(–red); }
.gap-pill.tie { background: rgba(243,156,18,0.2); color: var(–yellow); }

/* ── BOTTOM NAV (hidden, using tabs instead) ── */
.install-hint {
background: rgba(27,111,200,0.1);
border: 1px solid rgba(27,111,200,0.3);
border-radius: 10px;
padding: 10px 14px;
font-size: 11px;
color: var(–muted);
display: flex;
align-items: center;
gap: 8px;
margin-bottom: 12px;
}
.install-hint .icon { font-size: 16px; flex-shrink: 0; }

/* ── ANIMATIONS ── */
@keyframes fadeUp {
from { opacity: 0; transform: translateY(10px); }
to   { opacity: 1; transform: translateY(0); }
}
.card { animation: fadeUp 0.3s ease both; }
.card:nth-child(2) { animation-delay: 0.05s; }
.card:nth-child(3) { animation-delay: 0.10s; }
.card:nth-child(4) { animation-delay: 0.15s; }

/* 数字变化闪烁 */
@keyframes flash {
0%, 100% { opacity: 1; }
50% { opacity: 0.3; }
}
.flash { animation: flash 0.3s ease; }
</style>

</head>

// ════════════════════════════════════════

const TOTAL = 30;
const ZJ_PENALTY = -5;

// 主要对手 { name, penalty, basePts(前3轮比赛积分) }
const RIVALS = [
  { name: '成都蓉城', penalty: 0,   basePts: 7,  color: '#3b82f6' },
  { name: '北京国安', penalty: -5,  basePts: 4,  color: '#a855f7' },
  { name: '上海海港', penalty: -5,  basePts: 3,  color: '#06b6d4' },
  { name: '山东泰山', penalty: -6,  basePts: 6,  color: '#eab308' },
  { name: '上海申花', penalty: -10, basePts: 6,  color: '#6b7280' },
];

const STORAGE_KEY = 'zj2026_matches';

// 前3轮默认数据
const DEFAULT_MATCHES = [
  { round: 1, opp: '青岛西海岸', gf: 0, ga: 0, result: 'draw', pts: 1 },
  { round: 2, opp: '武汉三镇',   gf: 3, ga: 1, result: 'win',  pts: 3 },
  { round: 3, opp: '青岛海牛',   gf: 4, ga: 1, result: 'win',  pts: 3 },
];

let matches = loadMatches();
let selectedResult = null;
let sim = { w: 22, d: 1, l: 4 };

function loadMatches() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [...DEFAULT_MATCHES];
  } catch { return [...DEFAULT_MATCHES]; }
}

function saveMatches() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(matches)); } catch {}
}

// ════════════════════════════════════════
// COMPUTE
// ════════════════════════════════════════
function stats() {
  const played  = matches.length;
  const gamePts = matches.reduce((s, m) => s + m.pts, 0);
  const actual  = gamePts + ZJ_PENALTY;
  const remain  = TOTAL - played;
  const wins    = matches.filter(m => m.result === 'win').length;
  const draws   = matches.filter(m => m.result === 'draw').length;
  const losses  = matches.filter(m => m.result === 'loss').length;
  const gf      = matches.reduce((s, m) => s + m.gf, 0);
  const ga      = matches.reduce((s, m) => s + m.ga, 0);
  // 当前节奏外推
  const winRate = played > 0 ? gamePts / played : 0;
  const projGame = Math.round(gamePts + winRate * remain);
  const projActual = projGame + ZJ_PENALTY;
  return { played, gamePts, actual, remain, wins, draws, losses, gf, ga, projActual, winRate };
}

function simResult() {
  const s = stats();
  const addPts = sim.w * 3 + sim.d;
  const total   = s.actual + addPts;
  const simTotal = sim.w + sim.d + sim.l;
  return { addPts, total, simTotal, remain: s.remain };
}

function rivalActual(r) {
  return r.basePts + r.penalty;
}

function verdict(pts) {
  if (pts >= 72) return { cls: 'great', icon: '🏆', text: '夺冠热门', sub: '积分目标已超历史夺冠线' };
  if (pts >= 65) return { cls: 'good',  icon: '🎯', text: '强力争冠', sub: '具备夺冠实力' };
  if (pts >= 58) return { cls: 'ok',    icon: '⚔️', text: '争冠竞争者', sub: '需紧盯蓉城走势' };
  if (pts >= 50) return { cls: 'warn',  icon: '🏃', text: '争亚冠席位', sub: '与冠军有差距' };
  return { cls: 'bad', icon: '⚠️', text: '积分偏低', sub: '需大幅提升战绩' };
}

// ════════════════════════════════════════
// RENDER
// ════════════════════════════════════════
function render() {
  const s = stats();
  document.getElementById('round-chip').textContent = 'R' + s.played;

  // Dashboard stats
  setFlash('d-actual', s.actual >= 0 ? s.actual : s.actual);
  document.getElementById('d-remain').textContent = s.remain;
  document.getElementById('d-proj').textContent = s.remain > 0 ? s.projActual : s.actual;
  document.getElementById('d-record').textContent = `${s.wins}胜${s.draws}平${s.losses}负`;

  // Verdict
  const v = verdict(s.projActual);
  const banner = document.getElementById('verdict-banner');
  banner.className = 'verdict-banner ' + v.cls;
  document.getElementById('verdict-icon').textContent = v.icon;
  document.getElementById('verdict-text').textContent = v.text;
  document.getElementById('verdict-sub').textContent = v.sub;

  // Standings bars
  renderBars(s);

  // Rivals gap
  renderRivals(s);

  // Sim
  renderSim(s);

  // History
  renderHistory();
  renderSeasonStats(s);

  // Next round default
  const nextRound = s.played + 1;
  if (nextRound <= TOTAL) {
    const inp = document.getElementById('inp-round-hidden');
    if (inp) inp.value = nextRound;
  }

  saveMatches();
}

function setFlash(id, val) {
  const el = document.getElementById(id);
  el.textContent = val;
  el.classList.remove('flash');
  void el.offsetWidth;
  el.classList.add('flash');
}

function renderBars(s) {
  const allTeams = [
    { name: '浙江队', penalty: ZJ_PENALTY, gamePts: s.gamePts, color: '#1B6FC8', isUs: true },
    ...RIVALS.map(r => ({ name: r.name, penalty: r.penalty, gamePts: r.basePts, color: r.color, isUs: false })),
  ].sort((a, b) => (b.gamePts + b.penalty) - (a.gamePts + a.penalty));

  const maxPts = Math.max(...allTeams.map(t => t.gamePts + t.penalty)) || 1;

  document.getElementById('standings-bars').innerHTML = allTeams.map(t => {
    const actual = t.gamePts + t.penalty;
    const pct = Math.max(2, (actual / (maxPts + 5)) * 100);
    const penLabel = t.penalty === 0 ? '无扣分' : `扣${Math.abs(t.penalty)}`;
    const tagCls = t.penalty === 0 ? 'zero' : 'neg';
    const nameStyle = t.isUs ? 'font-weight:700;color:var(--zj-light)' : '';
    const ptsStyle = t.isUs ? 'color:var(--zj-light)' : '';
    return `
    <div class="team-bar">
      <div class="team-bar-header">
        <div class="team-bar-name" style="${nameStyle}">
          ${t.isUs ? '▶ ' : ''}${t.name}
          <span class="penalty-tag ${tagCls}">${penLabel}</span>
        </div>
        <div class="team-bar-pts" style="${ptsStyle}">${actual >= 0 ? '+' : ''}${actual}</div>
      </div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${pct.toFixed(1)}%;background:${t.color};${t.isUs ? 'box-shadow:0 0 8px '+t.color : ''}"></div>
      </div>
    </div>`;
  }).join('');
}

function renderRivals(s) {
  const html = RIVALS.map(r => {
    const rActual = rivalActual(r);
    const gap = s.actual - rActual;
    const gapStr = gap > 0
      ? `<span class="gap-pill lead">领先 +${gap}</span>`
      : gap < 0
      ? `<span class="gap-pill behind">落后 ${gap}</span>`
      : `<span class="gap-pill tie">同分</span>`;
    return `
    <div class="sim-result-row">
      <span class="lbl">${r.name}</span>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="val" style="color:var(--muted);font-size:12px">对方${rActual >= 0 ? '+' : ''}${rActual}分</span>
        ${gapStr}
      </div>
    </div>`;
  }).join('');
  document.getElementById('rivals-gap').innerHTML = html;
}

function renderSim(s) {
  const sw = sim.w, sd = sim.d, sl = sim.l;
  const simTotal = sw + sd + sl;
  const checkEl = document.getElementById('sim-match-check');
  if (simTotal !== s.remain) {
    checkEl.innerHTML = `<span style="color:var(--yellow)">⚠ 模拟${simTotal}场 ≠ 剩余${s.remain}场</span>`;
  } else {
    checkEl.innerHTML = `<span style="color:var(--green)">✓ 与剩余轮次匹配</span>`;
  }

  const addPts = sw * 3 + sd;
  const finalActual = s.actual + addPts;
  const v = verdict(finalActual);

  document.getElementById('sim-result').innerHTML = `
    <div class="sim-result-row">
      <span class="lbl">模拟战绩</span>
      <span class="val">${sw}胜 ${sd}平 ${sl}负</span>
    </div>
    <div class="sim-result-row">
      <span class="lbl">剩余新增积分</span>
      <span class="val">+${addPts}</span>
    </div>
    <div class="sim-result-row">
      <span class="lbl">现有积分</span>
      <span class="val">${s.actual}</span>
    </div>
    <div class="sim-result-row">
      <span class="lbl">赛季末预测</span>
      <span class="val big">${finalActual} 分</span>
    </div>
    <div class="sim-result-row">
      <span class="lbl">争冠评估</span>
      <span class="val">${v.icon} ${v.text}</span>
    </div>
  `;

  // 蓉城对比（0扣分，假设同战绩）
  const chengduCurrent = 7; // 前3轮后实际积分
  const chengduFinal = chengduCurrent + addPts;
  const zjFinal = finalActual;
  const diff = zjFinal - chengduFinal;
  const diffEl = diff > 0
    ? `<span class="val green">浙江领先 +${diff}分 🎉</span>`
    : diff < 0
    ? `<span class="val red">蓉城领先 ${Math.abs(diff)}分，浙江需蓉城失速</span>`
    : `<span class="val" style="color:var(--yellow)">同分！靠净胜球决定</span>`;

  document.getElementById('sim-rival').innerHTML = `
    <div class="sim-result-row">
      <span class="lbl">蓉城当前积分</span>
      <span class="val">${chengduCurrent}</span>
    </div>
    <div class="sim-result-row">
      <span class="lbl">蓉城同战绩预测</span>
      <span class="val big gold">${chengduFinal} 分</span>
    </div>
    <div class="sim-result-row">
      <span class="lbl">浙江 vs 蓉城</span>
      ${diffEl}
    </div>
    <div class="sim-result-row">
      <span class="lbl">蓉城需&lt;X胜才被超越</span>
      <span class="val">${calcRivalBreakeven(s, addPts)} 胜（同平负比）</span>
    </div>
  `;
}

function calcRivalBreakeven(s, zjAddPts) {
  // 蓉城需要打多少胜才能和浙江同分
  // chengduFinal = 7 + w*3 + d  =  zjFinal
  // zjFinal = s.actual + zjAddPts
  const zjFinal = s.actual + zjAddPts;
  // 假设蓉城平负和浙江一样
  const d = sim.d, l = sim.l;
  // 7 + w*3 + d = zjFinal  =>  w = (zjFinal - 7 - d) / 3
  const breakW = Math.ceil((zjFinal - 7 - d) / 3);
  return Math.max(0, breakW);
}

function renderHistory() {
  const list = document.getElementById('history-list');
  if (matches.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="icon">📋</div>暂无比赛记录</div>';
    return;
  }
  const sorted = [...matches].sort((a, b) => b.round - a.round);
  list.innerHTML = sorted.map(m => {
    const origIdx = matches.findIndex(x => x.round === m.round);
    const dotCls = 'dot-' + m.result;
    const ptsCls = 'pts-' + m.result;
    const resTxt = m.result === 'win' ? '胜' : m.result === 'draw' ? '平' : '负';
    return `
    <div class="match-item">
      <div class="match-round">R${m.round}</div>
      <div class="match-dot ${dotCls}"></div>
      <div class="match-body">
        <div class="match-opp">${resTxt} vs ${m.opp}</div>
        <div class="match-score">${m.gf} : ${m.ga}</div>
      </div>
      <div class="match-pts ${ptsCls}">+${m.pts}</div>
      <button class="del-btn" onclick="deleteMatch(${origIdx})">×</button>
    </div>`;
  }).join('');
}

function renderSeasonStats(s) {
  const gd = s.gf - s.ga;
  const winRate = s.played > 0 ? ((s.wins / s.played) * 100).toFixed(0) : 0;
  document.getElementById('season-stats').innerHTML = `
    <div class="sim-result-row">
      <span class="lbl">比赛场次</span>
      <span class="val">${s.played} / ${TOTAL}</span>
    </div>
    <div class="sim-result-row">
      <span class="lbl">胜率</span>
      <span class="val">${winRate}%</span>
    </div>
    <div class="sim-result-row">
      <span class="lbl">进 / 失球</span>
      <span class="val">${s.gf} / ${s.ga}</span>
    </div>
    <div class="sim-result-row">
      <span class="lbl">净胜球</span>
      <span class="val" style="color:${gd >= 0 ? 'var(--green)' : 'var(--red)'}">${gd >= 0 ? '+' : ''}${gd}</span>
    </div>
    <div class="sim-result-row">
      <span class="lbl">比赛积分</span>
      <span class="val">${s.gamePts}</span>
    </div>
    <div class="sim-result-row">
      <span class="lbl">实际积分（扣${Math.abs(ZJ_PENALTY)}后）</span>
      <span class="val" style="color:var(--zj-light)">${s.actual}</span>
    </div>
  `;
}

// ════════════════════════════════════════
// INTERACTIONS
// ════════════════════════════════════════
function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    const pages = ['dashboard','record','sim','history'];
    t.classList.toggle('active', pages[i] === name);
  });
  document.querySelectorAll('.page').forEach(p => {
    p.classList.toggle('active', p.id === 'page-' + name);
  });
  window.scrollTo(0, 0);
}

function setOpp(name) {
  document.getElementById('inp-opp').value = name;
}

function setResult(r) {
  selectedResult = r;
  ['win','draw','loss'].forEach(x => {
    const btn = document.getElementById('btn-' + x);
    btn.className = 'result-btn' + (x === r ? ' sel-' + x : '');
  });
  const btn = document.getElementById('submit-btn');
  btn.disabled = false;
  btn.textContent = r === 'win' ? '✓ 录入胜场 (+3分)' : r === 'draw' ? '✓ 录入平局 (+1分)' : '✓ 录入负场 (+0分)';

  // Auto-sync score → result
  syncScoreResult();
}

function syncScoreResult() {
  const gf = parseInt(document.getElementById('inp-gf').value) || 0;
  const ga = parseInt(document.getElementById('inp-ga').value) || 0;
  const auto = gf > ga ? 'win' : gf < ga ? 'loss' : 'draw';
  setResult(auto);
}

// Listen to score changes
['inp-gf','inp-ga'].forEach(id => {
  document.getElementById(id).addEventListener('input', syncScoreResult);
});

function addMatch() {
  if (!selectedResult) return;
  const s = stats();
  const round = s.played + 1;
  const opp = document.getElementById('inp-opp').value.trim() || '未知对手';
  const gf  = parseInt(document.getElementById('inp-gf').value) || 0;
  const ga  = parseInt(document.getElementById('inp-ga').value) || 0;
  const pts = selectedResult === 'win' ? 3 : selectedResult === 'draw' ? 1 : 0;

  if (round > TOTAL) { alert('已达30轮上限'); return; }

  matches.push({ round, opp, gf, ga, result: selectedResult, pts });
  matches.sort((a, b) => a.round - b.round);

  // Reset form
  selectedResult = null;
  document.getElementById('inp-opp').value = '';
  document.getElementById('inp-gf').value = 0;
  document.getElementById('inp-ga').value = 0;
  ['win','draw','loss'].forEach(x => document.getElementById('btn-' + x).className = 'result-btn');
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = '请先选择结果';

  render();
  switchTab('dashboard');
}

function deleteMatch(idx) {
  if (confirm(`删除第${matches[idx].round}轮记录？`)) {
    matches.splice(idx, 1);
    render();
  }
}

function clearAll() {
  if (confirm('清空所有记录，恢复前3轮默认数据？')) {
    matches = [...DEFAULT_MATCHES];
    render();
  }
}

function adjSim(key, delta) {
  const map = { w: 'w', d: 'd', l: 'l' };
  sim[map[key]] = Math.max(0, sim[map[key]] + delta);
  document.getElementById('sim-' + map[key]).textContent = sim[map[key]];
  const s = stats();
  renderSim(s);
}

// ════════════════════════════════════════
// INIT
// ════════════════════════════════════════
render();
</script>

</body>
</html>
