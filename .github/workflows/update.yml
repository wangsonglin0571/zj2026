name: Update CSL Standings

on:
  schedule:
    # 每天北京时间 11:00 做一次常规同步
    - cron: '0 3 * * *'
    # 每天北京时间 18:00-23:30 每 30 分钟检查一次
    - cron: '0,30 10-15 * * *'
  workflow_dispatch:  # 仍可在 GitHub Actions 页面手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Check sources
        run: python fetch_standings.py --check-sources

      - name: Fetch standings
        run: python fetch_standings.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes, skip commit"
          else
            git commit -m "auto: update standings $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
